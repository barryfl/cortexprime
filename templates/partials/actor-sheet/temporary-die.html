<div class="temporary-die-controls flex flex-ac flex-wrap" data-trait-path="{{traitPath}}">
  {{#if editable}}
    <button class="btn btn-icon btn-icon-plain-cpt btn-small" data-action="changeTemporaryDie"
      data-direction="down" data-trait-path="{{traitPath}}" title="{{localize 'TemporaryStepDown'}}"
      {{#unless view.canStepDown}}disabled{{/unless}} type="button">
      <i class="fa fa-minus"></i>
    </button>
    <button class="btn btn-icon btn-icon-plain-cpt btn-small" data-action="changeTemporaryDie"
      data-direction="reset" data-trait-path="{{traitPath}}" title="{{localize 'ResetTemporaryTraitStep'}}"
      {{#unless view.adjusted}}disabled{{/unless}} type="button">
      <i class="fa fa-rotate-left"></i>
    </button>
    <button class="btn btn-icon btn-icon-plain-cpt btn-small" data-action="changeTemporaryDie"
      data-direction="up" data-trait-path="{{traitPath}}" title="{{localize 'TemporaryStepUp'}}"
      {{#unless view.canStepUp}}disabled{{/unless}} type="button">
      <i class="fa fa-plus"></i>
    </button>
  {{/if}}
  {{#if view.adjusted}}
    <span class="temporary-die-adjustment" title="{{localize 'TemporaryTraitAdjustment'}}">({{view.adjustmentLabel}})</span>
    <span class="temporary-die-effective" title="{{localize 'EffectiveDie'}}">
      {{#each view.effectiveDice as |die|}}d{{die}}{{#unless @last}}, {{/unless}}{{/each}}
    </span>
    <span class="temporary-die-base" title="{{localize 'PermanentBaseDie'}}">
      {{localize 'Base'}} {{#each view.baseDice as |die|}}d{{die}}{{#unless @last}}, {{/unless}}{{/each}}
    </span>
  {{/if}}
</div>
