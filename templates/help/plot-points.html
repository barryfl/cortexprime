<section class="cortexprime-help">
  <h2>Plot Points</h2>

  <p>
    Actors with Plot Points enabled display their current Plot Point total on the sheet.
  </p>

  <p>
    Use the plus and spend controls to increase or decrease the current total.
  </p>

  <p>
    Plot Point availability and use are determined by the rules and configuration of
    your Cortex Prime game.
  </p>
</section>
